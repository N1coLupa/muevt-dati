# Aggiornamento dei dati di Muevt.
#
# Tre tentativi al giorno: dopo l'ultima corsa (22:15 UTC), all'alba e a meta'
# giornata. Se una fonte non risponde, run-daily tiene i dati del giorno prima
# e aggiorna le altre; i file cambiati vengono pubblicati subito sul ramo
# principale, da cui l'app li scarica.

name: Aggiorna dati

on:
  schedule:
    - cron: '15 22 * * *'
    - cron: '30 4 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Niente script di installazione delle dipendenze: meno rischi dalla catena di fornitura.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scarica, controlla e firma
        run: npm run aggiorna
        env:
          MUEVT_FIRMA_CHIAVE: ${{ secrets.MUEVT_FIRMA_CHIAVE }}

      - name: Pubblica i dati cambiati
        run: |
          git config user.name "muevt-dati"
          git config user.email "muevt-dati@users.noreply.github.com"
          git add dati storico
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Dati del $(date -u +%Y-%m-%d)"
            git push
          fi
